name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    # =========================================
    # MySQL dùng riêng cho GitHub Actions
    # =========================================
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shoe_shopdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # =========================================
      # 1. Checkout source code
      # =========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================
      # 2. Setup Java 17
      # =========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # =========================================
      # 3. Wait for MySQL
      # =========================================
      - name: Wait for MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

          until mysqladmin ping \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            --silent
          do
            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL is ready!"

      # =========================================
      # 4. Build Project
      # =========================================
      - name: Build Project
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: shoe_shopdb
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn clean compile

      # =========================================
      # 5. Unit Test
      # =========================================
      - name: Run Unit Test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: shoe_shopdb
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn test

      # =========================================
      # 6. Trivy Scan Source Code & Dockerfile
      # =========================================
      - name: Scan Source Code & Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      # =========================================
      # 7. Login Docker Hub
      # =========================================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================================
      # 8. Build and Push Docker Image
      # =========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/shoeshop:latest
            ${{ secrets.DOCKER_USERNAME }}/shoeshop:${{ github.sha }}

      # =========================================
      # 9. Trivy Scan Docker Image
      # =========================================
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/shoeshop:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code:
            0
            # =========================================
      # 10. Trigger Render Deployment
      # =========================================
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
