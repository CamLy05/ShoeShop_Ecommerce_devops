name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      # ============================
      # Checkout source code
      # ============================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================
      # Setup Java 17
      # ============================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ============================
      # Build Project
      # ============================
      - name: Build Project
        run: mvn clean compile

      # ============================
      # Unit Test
      # ============================
      - name: Run Unit Test
        run: mvn test

      # ============================
      # Trivy Scan Source Code
      # ============================
      - name: Scan Source Code & Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      # ============================
      # Build Docker Image
      # ============================
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/shoeshop:latest .

      # ============================
      # Trivy Scan Docker Image
      # ============================
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/shoeshop:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      # ============================
      # Login Docker Hub
      # ============================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================
      # Push Docker Image
      # ============================
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shoeshop:latest
